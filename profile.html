<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Your profile | TripNova</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div id="site-header"></div>
    <main>
        <section class="page-hero compact"><span class="eyebrow light">YOUR TRIPNOVA</span>
            <h1>Your travel <em>corner.</em></h1>
            <p>Manage your demo account, saved places, and booking history.</p>
        </section>
        <section class="section profile-layout">
            <aside id="profile-card" class="profile-card"></aside>
            <div class="profile-main">
                <section class="profile-panel">
                    <div class="section-heading">
                        <div><span class="eyebrow">YOUR ADVENTURES</span>
                            <h2>Booking history</h2>
                        </div>
                    </div>
                    <div id="booking-history"></div>
                </section>
                <section class="profile-panel">
                    <div class="section-heading">
                        <div><span class="eyebrow">PLACES YOU LOVE</span>
                            <h2>Your wishlist</h2>
                        </div>
                    </div>
                    <div id="wishlist-grid" class="destination-grid compact-grid"></div>
                </section>
            </div>
        </section>
    </main>
    <div id="site-footer"></div>
    <script src="js/app.js"></script>
</body>

</html>
