<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Destinations | TripNova</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div id="site-header"></div>
    <main>
        <section class="page-hero"><span class="eyebrow light">THE WORLD, YOUR WAY</span>
            <h1>Find your <em>somewhere.</em></h1>
            <p>Big adventures, quiet corners, and everything in between.</p>
        </section>
        <section class="section">
            <div class="filter-bar"><label class="search-box"><span>⌕</span><input id="destination-search" type="search"
                        placeholder="Search places, experiences..."></label><select id="category-filter"
                    aria-label="Filter by category">
                    <option value="all">All experiences</option>
                    <option value="Beach">Beach</option>
                    <option value="Mountain">Mountain</option>
                    <option value="Culture">Culture</option>
                    <option value="Adventure">Adventure</option>
                </select><select id="sort-filter" aria-label="Sort destinations">
                    <option value="featured">Featured</option>
                    <option value="price-low">Price: low to high</option>
                    <option value="price-high">Price: high to low</option>
                    <option value="rating">Top rated</option>
                </select></div>
            <p id="result-count" class="muted result-count"></p>
            <div id="destination-grid" class="destination-grid"></div>
            <div id="empty-state" class="empty-state hidden"><span>✦</span>
                <h3>No places found</h3>
                <p>Try another search or category.</p>
            </div>
        </section>
    </main>
    <div id="site-footer"></div>
    <script src="js/app.js"></script>
</body>

</html>
